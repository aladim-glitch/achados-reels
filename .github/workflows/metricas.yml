# Coleta o desempenho real dos Reels (24/48/72 h) e atualiza o aprendizado das proximas publicacoes.
name: Metricas dos Reels

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */4 * * *"   # a cada 4 horas

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar metricas
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "Secret IG_TOKEN ainda nao cadastrado; nada a fazer."; exit 0; fi
          python metricas.py
      - name: Salvar
        run: |
          git config user.name "achados-bot"; git config user.email "bot@users.noreply.github.com"
          git add estado/metricas.json estado/relatorio.md 2>/dev/null || true
          git commit -m "Metricas $(date -u +%F_%H%M)" && git pull --rebase && git push || true
